name: Build Fossil

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential tclsh pkg-config libssl-dev zlib1g-dev

      - name: Configure and build
        run: |
          ./configure --static CFLAGS='-O2 -s'
          make -j"$(nproc)"

      - name: Package binary
        run: |
          mkdir -p dist
          cp fossil dist/fossil-linux-amd64
          tar -czf dist/fossil-linux-amd64.tar.gz -C dist fossil-linux-amd64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: fossil-linux-amd64
          path: dist/fossil-linux-amd64.tar.gz

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-zlib
            make
            tcl

      - name: Build with MinGW makefile
        shell: msys2 {0}
        run: |
          export PATH="/ucrt64/bin:$PATH"
          make -f win/Makefile.mingw X64=1 PREFIX=x86_64-w64-mingw32- -j2

      - name: Package binary
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp fossil.exe dist/fossil-windows-amd64.exe
          zip -r dist/fossil-windows-amd64.zip dist/fossil-windows-amd64.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: fossil-windows-amd64
          path: dist/fossil-windows-amd64.zip

  build-hiwifi2-mipsel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential tclsh pkg-config xz-utils wget

      - name: Install OpenWrt SDK for mt7620
        run: |
          wget -q https://downloads.openwrt.org/releases/23.05.3/targets/ramips/mt7620/openwrt-sdk-23.05.3-ramips-mt7620_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          mkdir -p openwrt-sdk
          tar xf openwrt-sdk-*.tar.xz -C openwrt-sdk --strip-components=1
          TOOLCHAIN_DIR=$(find openwrt-sdk/staging_dir -type d -name 'toolchain-*' | head -1)
          TOOLCHAIN_DIR="$PWD/$TOOLCHAIN_DIR"
          echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR" >> "$GITHUB_ENV"
          echo "STAGING_DIR=$PWD/openwrt-sdk/staging_dir" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
          echo "=== Toolchain dir ==="
          echo "$TOOLCHAIN_DIR"
          echo "=== Cross compiler candidates ==="
          ls "$TOOLCHAIN_DIR/bin" | grep 'mipsel' | head -20 || true

      - name: Build target zlib for mipsel
        run: |
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export STAGING_DIR="$PWD/openwrt-sdk/staging_dir"
          mkdir -p "$PWD/target-zlib"
          cd compat/zlib
          CC=mipsel-openwrt-linux-musl-gcc \
          AR=mipsel-openwrt-linux-musl-ar \
          RANLIB=mipsel-openwrt-linux-musl-ranlib \
          ./configure --static --host=mipsel-openwrt-linux-musl --prefix="$PWD/../target-zlib"
          make -j"$(nproc)"
          make install

      - name: Configure and build for HiWiFi2 mipsel
        env:
          CC: mipsel-openwrt-linux-musl-gcc
          AR: mipsel-openwrt-linux-musl-ar
          RANLIB: mipsel-openwrt-linux-musl-ranlib
        run: |
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export STAGING_DIR="$PWD/openwrt-sdk/staging_dir"
          export CFLAGS='-O2 -s -msoft-float'
          ./configure --static --with-openssl=none --with-zlib="$PWD/target-zlib"
          make -j"$(nproc)"

      - name: Package binary
        run: |
          mkdir -p dist
          cp fossil dist/fossil-hiwifi2-mipsel
          tar -czf dist/fossil-hiwifi2-mipsel.tar.gz -C dist fossil-hiwifi2-mipsel

      - name: Upload HiWiFi2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: fossil-hiwifi2-mipsel
          path: dist/fossil-hiwifi2-mipsel.tar.gz
